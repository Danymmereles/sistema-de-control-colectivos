- Front
    - Panel de control
        - Modificar valores de KP, KV, KS
        - Perturbacion
    - Visualizacion de la demora 
    - Consola del colectivo
    - Visualizacion de señales
    - Planificacion inicial
    - Visualizacion del recorrido
    - Tiempo transcurrido
    - Modificacion de recorrido
        - Agregar/Sacar paradas
    - Aplicar aceleracion
- Back
    - Recibe la planificacion inicial
    - Avance de tiempo -> Cada 10 segundos que es cuando el gps manda la señal
    - Controlador
        - Metricas de gps
        - Calcula donde deberia estar segun la planificacion
        - Compara
        - Manda al actuador
    - actuador  
        - Recibe mensaje por pantalla
        - Le da opcion de cambiar la velocidad
    - Proceso
        - Visualizacion del recorrido actual, tiempo real
        - Termina recorrido -> Te muestra los resultados y termina la simulacion    
            - Promedio de demora
            - Desvio total
            - Bla bla bla
    - Elemento de medicion
        - calculo actual
        - Manda informacion

    - Perturbaciones
        - Demora en suba y baja de pasajeros
        - Cortes, arreglos, manifestaciones 
            - Darle la opcion de cuanto se demora y/o desvia
                - Si se desvia, se debe calcular con las metricas el punto actual
    - Fallas
        - Problemas tecnicos del colectivo  
            - Se fallo y se cancela
            - Termina la simulacion

Estructura creada en TdC - Mereles y Soto\

plan.md                         ← diseño y decisiones documentadas
backend/
├── pom.xml                     ← Spring Boot 3.2 + WebSocket
└── src/main/java/com/colectivos/
    ├── ColectivosApplication   ← Main
    ├── model/                  ← Route, Stop, Event, JourneyState, enums...
    ├── core/                   ← MODEL: bucle de control
    │   ├── RouteProcess        ← simula recorrido, aplica perturbaciones
    │   ├── MeasurementElement  ← mide estado real (Δt desde último tick)
    │   ├── SystemController    ← compara esperado vs real, emite señal
    │   ├── BusActuator         ← actúa según señal (OK/DELAYED/CRITICAL)
    │   └── JourneyEngine       ← orquesta el bucle cada 10 seg, push WebSocket
    ├── presenter/              ← PRESENTER: REST + repositorio en memoria
    └── config/                 ← WebSocket STOMP, CORS, DataSeeder (3 rutas)
frontend/
├── package.json / vite / tailwind
└── src/
    ├── presenter/              ← useWebSocket (STOMP), useSystemState (acciones)
    ├── store/systemStore.js    ← Zustand: draft config vs active config
    ├── services/api.js         ← llamadas REST
    └── view/
        ├── ControlPanel/       ← panel draft/accept, 3 opciones de carga, eventos
        └── Visualizer/         ← progreso, métricas, señal controlador, log
Para ejecutar
Backend:


cd "TdC - Mereles y Soto/backend"
mvn spring-boot:run
Frontend (en otra terminal):


cd "TdC - Mereles y Soto/frontend"
npm install
npm run dev
Abre http://localhost:5173. El panel edita en draft — los cambios se aplican solo al pulsar "Aceptar cambios". El visualizador sigue corriendo mientras se edita.